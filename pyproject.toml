[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiveflow-swarm"
version = "0.1.2"
description = "Hiveflow Swarm: delegate agents on Flower with SwarmMind + SwarmAuth, human approval and shared vaccines (health and finance)"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr>=1.39.0,<2.0",
    "openai>=2.16.0,<3.0.0",
    "cryptography>=42",
    "swarmauth @ git+https://github.com/hiveflowai/swarmauth.git",
    "swarmmind @ git+https://github.com/hiveflowai/swarmmind.git",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agent", "director"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "johnolven"
display-name = "Hiveflow Swarm"
color = "yellow"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "swarmauth/**/*.py", "swarmmind/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"

[tool.flwr.app.config]
coordinator-model = "flower-endeavor-v1.0"
participant-model = "openai/gpt-6-luna"
pull-timeout = 120
key-salt = ""
